<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Goal Columns</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="title-wrap">
          <h1>Neon Goal Columns</h1>
          <p class="subtitle">A vertical neon progress game for your goals.</p>
        </div>

        <div class="controls-wrap">
          <button id="addGoalBtn" class="btn btn-primary" type="button">Add Goal</button>
        </div>

        <div class="hud-wrap">
          <div class="overall-progress" aria-label="Overall progress">
            <div class="progress-track">
              <div id="overallProgressBar" class="progress-fill"></div>
            </div>
            <div class="hud-line">
              <span id="overallProgressText">0%</span>
              <span id="streakBadge" class="streak-badge">Streak: 0</span>
            </div>
          </div>
        </div>
      </header>

      <main id="goalBoard" class="goal-board" aria-live="polite"></main>
    </div>

    <div id="goalModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
      <div class="modal-card">
        <h2 id="goalModalTitle">Create Goal</h2>
        <form id="goalForm" class="modal-form">
          <label for="goalTitleInput">Goal Name</label>
          <input id="goalTitleInput" name="goalTitle" maxlength="60" required placeholder="e.g. Ship Portfolio v2" />

          <label for="goalStepsInput">Number of Steps (5-50)</label>
          <input id="goalStepsInput" name="goalSteps" type="number" min="5" max="50" value="10" required />

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close-modal="goalModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>

    <div id="stepModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="stepModalTitle">
      <div class="modal-card">
        <h2 id="stepModalTitle">Edit Step</h2>
        <p id="stepModalMeta" class="modal-meta"></p>
        <form id="stepForm" class="modal-form">
          <label for="stepTitleInput">Step Title</label>
          <input id="stepTitleInput" name="stepTitle" maxlength="70" required />

          <label for="stepDescriptionInput">Description</label>
          <textarea id="stepDescriptionInput" name="stepDescription" rows="4" maxlength="240" placeholder="Optional note for this step"></textarea>

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close-modal="stepModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Step</button>
          </div>
        </form>
      </div>
    </div>

    <div id="goalCardModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="goalCardModalTitle">
      <div class="modal-card modal-card-wide">
        <h2 id="goalCardModalTitle">Goal Card Editor</h2>
        <p id="goalCardModalMeta" class="modal-meta"></p>
        <form id="goalCardForm" class="modal-form">
          <label for="goalCardTitleInput">Goal Title</label>
          <input id="goalCardTitleInput" name="goalCardTitle" maxlength="60" required />

          <div class="goal-card-grid">
            <div>
              <label for="goalCardWidthInput">Column Width (140-360px)</label>
              <input id="goalCardWidthInput" name="goalCardWidth" type="number" min="140" max="360" step="2" />
            </div>
            <div>
              <label for="goalCardColorInput">Goal Color</label>
              <input id="goalCardColorInput" name="goalCardColor" type="color" />
            </div>
          </div>

          <div class="goal-card-steps-head">
            <strong>All Steps</strong>
            <span>Edit titles and descriptions for every step.</span>
          </div>

          <div id="goalCardStepsEditor" class="goal-card-steps" aria-live="polite"></div>

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close-modal="goalCardModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Goal Card</button>
          </div>
        </form>
      </div>
    </div>

    <div id="stepTooltip" class="step-tooltip hidden" role="status" aria-live="polite"></div>
    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
